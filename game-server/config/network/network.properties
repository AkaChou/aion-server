#
# ----------------------------
# 网络配置 / Network Config's:
# ----------------------------

# Aion客户端尝试连接的地址（格式为 host:port）。 / Address where Aion clients will attempt to connect to (format is host:port).
# 由于客户端不支持IPv6，主机部分可以是IPv4地址或解析到IPv4地址的主机名/域名。 / The host part can be an IPv4 address or a host/domain name which resolves to an IPv4 address since the client does not support IPv6.
# 默认情况下，连接地址与socket地址相同（如果主机部分设置为0.0.0.0，服务器会自动选择最合适的本地 / By default, the connect address is the same as the socket address (if the host part is set to 0.0.0.0 the server will auto select the most suitable local
# IPv4地址并记录到日志）。 / IPv4 address and log it).
gameserver.network.client.connect_address = ${gameserver.network.client.socket_address}

# 游戏服务器监听Aion客户端连接的本地地址（0.0.0.0 = 绑定任意本地IP） / Local address where GS will listen for Aion client connections (0.0.0.0 = bind any local IP)
gameserver.network.client.socket_address = 0.0.0.0:7777

# 登录服务器地址（主机名/域名或IP） / Address (host/domain name or IP) of the login server
gameserver.network.login.address = localhost:9014

# 此游戏服务器ID / Id of this game server
gameserver.network.login.gsid = 1

# 此游戏服务器密码 / Password of this game server
gameserver.network.login.password = 1234

# 允许账号连接所需的最低权限等级（=维护模式） / Minimum required access level for accounts trying to connect (=maintenance mode)
gameserver.network.login.min_accesslevel = 0

# 服务器最大在线玩家数 / Maximum online players on the server
gameserver.network.login.max_players = 100

# 聊天服务器地址（主机名/域名或IP） / Address (host/domain name or IP) of the chat server
gameserver.network.chat.address = localhost:9021

# 此游戏服务器连接聊天服务器的密码 / Password of this game server for chat server
gameserver.network.chat.password = 

# 仅用于读写网络数据的额外线程数。 / Number of extra threads dedicated only to read/write network data.
# 值小于1表示接收线程也会处理读写。 / Value < 1 means that acceptor thread will also handle read & write.
# 值大于0表示会有 x 个专用读写线程 + 1 个接收线程。 / Value > 0 means there will be x dedicated read/write threads + 1 acceptor.
gameserver.network.nio.threads = 1

# 允许 nio.threads 大于1。仅用于开发/调试，游戏服务器并非线程安全！ / Allows values > 1 for nio.threads. Only for development/debugging - the game server is not thread-safe!
gameserver.network.nio.threads.unsafe.allow = false

# 用于执行客户端封包的最小线程数 / Number of threads (min) that will be used to execute client packets
gameserver.network.packet.processor.threads.min = 4

# 用于执行客户端封包的最大线程数 / Number of threads (max) that will be used to execute client packets
gameserver.network.packet.processor.threads.max = 4

# 决定何时销毁封包处理线程的阈值 / Threshold used to decide when packet processor thread should be killed
# 仅当最小线程数不等于最大线程数时生效 / It have effect only if min threads != max threads
gameserver.network.packet.processor.threshold.kill = 3

# 决定何时创建额外封包处理线程的阈值 / Threshold used to decide when extra packet processor thread should be spawned
# 仅当最小线程数不等于最大线程数时生效 / It have effect only if min threads != max threads
gameserver.network.packet.processor.threshold.spawn = 50

# 启用/禁用收到Aion客户端未知封包时的日志消息 / Enable/disable log messages for unknown packets received from the aion client
gameserver.network.logging.unknown_packets = false

# 启用/禁用因连接状态无效而忽略Aion客户端封包时的日志消息 / Enable/disable log messages for ignored aion client packets (due to invalid connection state)
gameserver.network.logging.ignored_packets = false

# 启用洪泛保护 / Enable flood protector
gameserver.network.flood.connections = false

# 洪泛检测tick间隔（毫秒） / Flood ms in tick
gameserver.network.flood.tick = 1000

# 短周期 / Short period
gameserver.network.flood.short.warn = 10
gameserver.network.flood.short.reject = 20
gameserver.network.flood.short.tick = 10

# 长周期 / Long period
gameserver.network.flood.long.warn = 30
gameserver.network.flood.long.reject = 60
gameserver.network.flood.long.tick = 60
