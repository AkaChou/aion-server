#
# ----------------------------
# 管理员配置 / Admin config's:
# ----------------------------

# 每个权限等级的自定义名称标签，其中 %s 是玩家名称占位符。 / Custom name tag for each access level, where %s is the placeholder for the players name.
# 指定逗号分隔的列表，从权限等级1的标签开始；或使用 "" 完全停用标签。 / Specify a comma separated list, starting with the tag for access level 1, or use "" to deactivate tags completely.
# 默认值： / Default:
# 权限等级1 = [空] / Access level 1 = [empty]
# 权限等级2 = 初级开发 / Access level 2 = Junior Dev
# 权限等级3 = 开发 / Access level 3 = Dev
# 权限等级4 = 初级活动管理员 / Access level 4 = Junior Event Master
# 权限等级5 = 活动管理员 / Access level 5 = Event Master
# 权限等级6 = 初级游戏管理员 / Access level 6 = Junior Game Master
# 权限等级7 = 游戏管理员 / Access level 7 = Game Master
# 权限等级8 = 高级游戏管理员 / Access level 8 = Senior Game Master
# 权限等级9 = 管理员 / Access level 9 = Admin
gameserver.administration.customtags = %s, \u00BBJDev\u00AB\uE04A%s, \u00BBDev\u00AB\uE04A%s, \u00BBJEM\u00AB\uE04A%s, \u00BBEM\u00AB\uE04A%s, \u00BBJGM\u00AB\uE04A%s, \u00BBGM\u00AB\uE04A%s, \u00BBSGM\u00AB\uE04A%s, \u00BBAdmin\u00AB\uE04A%s

# ----------------------------
# 权限配置 / Access config:
# ----------------------------
# 如果玩家具有给定或更高权限等级，该选项对其生效 / If the player has the given access level or higher, the option is active for him

# 无限制物品交易（受限制工作人员只能向普通玩家交易 item.restriction.txt 中列出的物品） / Unrestricted item trades (restricted staff members can only trade items listed in item.restriction.txt to normal players)
# 默认值：1 / Default: 1
gameserver.administration.unrestricted_itemtrade = 1

# GM面板 / GM Panel
# 默认值：2 / Default: 2
gameserver.administration.gm_panel = 2

# GM技能 / GM skills
# 默认值：8 / Default: 8
gameserver.administration.gm_skills = 8

# 全地图自由飞行 / Free Flight Everywhere
# 默认值：1 / Default: 1
gameserver.administration.flight.free_fly = 1

# GM无限飞行时间 / Unlimited Flight Time for GM's
# 默认值：1 / Default: 1
gameserver.administration.flight.unlimited_time = 1

# 无需技能即可在任意地点复活 / Resurrect anywhere without skill
# 默认值：1 / Default: 1
gameserver.administration.auto_res = 1

# 即使玩家拒绝，也可以查看玩家详情 / Can view player details, even when he denies it
# 默认值：5 / Default: 5
gameserver.administration.view_player_details = 5

# 无副本进入要求 / No instance requirements
# 默认值：2 / Default: 2
gameserver.administration.instance.enter_all = 2

# 无需钥匙打开所有门 / Open every door without using a key
# 默认值：6 / Default: 6
gameserver.administration.instance.open_doors = 6

# 点击副本门时显示门信息 / Show instance door info when clicking them
# 默认值：9 / Default: 9
gameserver.administration.instance.door_info = 9

# 点击门时进入关闭的住宅 / Enter closed houses when clicking the door
# 默认值：9 / Default: 9
gameserver.administration.house.enter_all = 9

# 点击门时显示住宅地址 / Show house address when clicking the door
# 默认值：9 / Default: 9
gameserver.administration.house.show_address = 9

# 点击对话窗口时显示附加信息（任务ID、对话动作等） / Show additional information when clicking through dialog windows (quest ID, dialog action, ...)
# 默认值：9 / Default: 9
gameserver.administration.dialog_info = 9

# 强化物品时显示成功状态/概率信息 / Show success state/chance information when enchanting items
# 默认值：9 / Default: 9
gameserver.administration.enchant_info = 9

# 客户端通知经过区域时显示区域名称 / Show zone names when client notifies about passing one
# 默认值：9 / Default: 9
gameserver.administration.zone_info = 9

# 接收来自 AuditLogger 的可疑非法玩家行为消息 / Receive messages about possibly illegal player actions from AuditLogger
# 默认值：9 / Default: 9
gameserver.administration.audit_info = 9

# //quest 命令： / //quest command:
# 使用 <reset> 和 <start> 以外参数所需的最低权限等级 / Minimum access level to use parameters other than <reset> and <start>
# 默认值：9 / Default: 9
gameserver.administration.command.quest.advanced_parameters = 9

# ----------------------------
# 连接选项 / Connection options:
# ----------------------------
# 以下选项对所有工作人员生效（权限等级 > 0） / The following options are active for all staff members (access level > 0)

# 登录时执行的聊天命令列表，逗号分隔 / Comma separated list of chat commands to execute on login
# 默认值：//invis, //invul, //enemy none, //see / Default: //invis, //invul, //enemy none, //see
gameserver.administration.login.execute_commands = //invis, //invul, //enemy none, //see

# 登录时查看服务器构建日期和版本所需的最低权限等级（自定义消息可在 events.xml 中通过 <login_message/> 定义） / Minimum access level to see the server build date and revision on login (custom messages can be defined in events.xml via <login_message/>)
# 默认值：9 / Default: 9
gameserver.administration.login.print_revision = 9

# 登录公告等级 / Login announce levels
# 1、2、3等 - 只公告指定权限等级的工作人员（"" = 关闭） / 1,2,3 etc - announce only staff members with that access level ("" = off)
# 默认值：* (announce all of them) / Default: * (announce all of them)
gameserver.administration.login.announce_levels = *

# GM登录公告模式（false = 仅向指定等级的其他GM公告） / GM login announce mode (false = announce only to other GMs with the specified levels)
# 默认值：true (announce to all players) / Default: true (announce to all players)
gameserver.administration.login.announce_to_all_players = true

# GM登出公告模式（false = 仅向指定等级的其他GM公告） / GM logout announce mode (false = announce only to other GMs with the specified levels)
# 默认值：true (announce to all players) / Default: true (announce to all players)
gameserver.administration.logout.announce_to_all_players = true
