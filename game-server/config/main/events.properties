#
# ----------------------------
# 活动配置 / Event config's:
# ----------------------------
# 禁用的活动（填入 timed_events 中的名称，逗号分隔；* 表示全部） / Disabled Events (insert comma separated names from timed_events or * for all)
# 活动开始和结束时间在 timed_events 中设置（没有开始/结束时间表示永久启用） / Start and end times for events are set in timed_events (no start and end time means permanently active)
# 默认值：空字符串（无） / Default: empty string (none)
gameserver.event.service.disabled_events = 

# ----------------------------
# 强化街机活动 / Event Upgrade Arcade:
# ----------------------------
# 启用Upgrade Arcade / Enable Upgrade Arcade
# 默认值：false / Default: false
gameserver.event.arcade.enable = false

# 恢复强化街机所需的代币数量 / Upgrade Arcade tokens needed to resume
# 默认值：3 / Default: 3
gameserver.event.arcade.resume_token = 3

# ----------------------------
# 入侵/世界BOSS / Invasion / World Raids:
# ----------------------------
# 启用世界BOSS - 默认值：true / Enable World Raids - Default: true
gameserver.worldraid.enable = true

# 启用世界BOSS刷新消息 - 默认值：true / Enable World Raid spawn message - Default: true
gameserver.worldraid.use_spawn_msg = true

# ----------------------------
# 猎头活动 / Headhunting:
# ----------------------------
# 启用Headhunting / Enable Headhunting
# 默认值：false / Default: false
gameserver.event.headhunting.enable = false

# 猎头活动允许的地图（例如 600090000,600100000） / Headhunting allowed maps (f.e. 600090000,600100000)
# 默认值： / Default:
gameserver.event.headhunting.maps = 

# 获得安慰奖所需的猎头击杀数 / Headhunting needed kills to receive the consolation prize
# 默认值：50 / Default: 50
gameserver.event.headhunting.consolation_prize_kills = 50

# ----------------------------
# 降临日历 / Advent Calendar:
# ----------------------------
# 降临日历 / Advent Calendar
# 默认值：false / Default: false
gameserver.event.advent_calendar.enable = false
