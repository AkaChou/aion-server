#
# ----------------------------
# 世界配置 / World config's:
# ----------------------------

# 世界区域大小 / World region size
# 默认值：128 / Default: 128
# 只能使用：64、128、256；使用其他值会导致mapRegion系统无法工作。 / Only use: 64,128,256 If use other value mapRegion system dont's work.
gameserver.world.region.size = 128

# 普通副本分线最大数量；设为0时使用 world_maps.xml 中的值 / Max number of usual twin count. If set to 0, values from world_maps.xml are used
# 默认值：1 - 每张地图只使用1个默认分线 / Default: 1 - only 1 default twin is used for each map
gameserver.world.max.twincount.usual = 1

# 新手分线最大数量；设为0时使用 world_maps.xml 中的值 / Max number of beginners twin count. If set to 0, values from world_maps.xml are used
# 默认值：-1 - 禁用 / Default: -1 - disabled
gameserver.world.max.twincount.beginner = -1

# 通过世界新手分线模拟快速通道；必须启用 / Emulate FastTrack by using world beginner twins. Have to enable
# gameserver.world.max.twincount.beginner 才能生效 / gameserver.world.max.twincount.beginner to make it working
# 默认值：true / Default: true
gameserver.world.emulate.fasttrack = true

# 区域 *.java处理器目录 / Location of zone *.java handlers
gameserver.world.zone_handler_directory = ./data/handlers/zone