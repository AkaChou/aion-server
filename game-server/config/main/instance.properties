#
# ----------------------------
# 副本配置 / Instance configs:
# ----------------------------

# 冷却时间缩短的倍数 / It's how many times the cooldown will be shorter
# 示例：3 = 1/3 of retail cooldown, 0 - disable cooldown / Example: 3 = 1/3 of retail cooldown, 0 - disable cooldown
# 默认值：1 / Default: 1
gameserver.instance.cooldown_rate = 5

# 不受自定义冷却倍率影响的副本地图ID列表 / List of instance map IDs, which should not be affected by the customized cooldown rate
# 默认值：空 / Default: empty
# 示例：300080000,300090000,300060000 / Example: 300080000,300090000,300060000
gameserver.instance.cooldown_rate.excluded_maps =

# 空副本被销毁前的时间（秒） / Time in seconds until an empty instance will be destroyed
# 默认值：600 (10 minutes) / Default: 600 (10 minutes)
gameserver.instance.destroy_delay_seconds = 600

# 空单人副本被销毁前的时间（秒） / Time in seconds until an empty solo instance will be destroyed
# 默认值：600 (10 minutes) / Default: 600 (10 minutes)
gameserver.instance.solo.destroy_delay_seconds = 600

# 副本内决斗 / Duel in Instance
# 默认值：true / Default: true
gameserver.instance.duel.enable = true

# ----------------------------
# 副本难度缩放 / Instance Difficulty Scaling
# ----------------------------

# 启用基于副本内玩家数量的动态难度缩放 / Enable dynamic difficulty scaling based on player count in instance
# 默认值：false / Default: false
gameserver.instance.scaling.enable = false

# 最低生命值倍率（例如0.5 = NPC不会低于基础生命值的50%） / Minimum HP multiplier (e.g. 0.5 = NPCs never drop below 50% of their base HP)
# 默认值：0.5 / Default: 0.5
gameserver.instance.scaling.hp_floor = 0.5

# 最低伤害倍率 / Minimum damage multiplier
# 默认值：0.5 / Default: 0.5
gameserver.instance.scaling.dmg_floor = 0.5

# 排除在副本缩放之外的副本地图ID / Instance map IDs excluded from instance scaling
gameserver.instance.scaling.excluded_maps =

# 副本 *.java处理器目录 / Location of instance *.java handlers
gameserver.instance.handler_directory = ./data/handlers/instance
