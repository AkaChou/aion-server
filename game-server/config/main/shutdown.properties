#
# ----------------------------
# 关服配置 / Shutdown config's:
# ----------------------------

# 常规关服和重启的延迟时间（秒）。 / Shutdown delay in seconds for regular shutdowns, as well as restarts.
# 默认值：120 / Default: 120
gameserver.shutdown.delay = 120

# 触发自动服务器重启的cron计划（每天5点 = 0 0 5 ? * *，每周三5点 = 0 0 5 ? * WED）。 / Cron schedule which triggers an automatic server restart (daily 5 AM = 0 0 5 ? * *, every wednesday 5 AM = 0 0 5 ? * WED).
# 默认值：空（= 禁用） / Default: empty (= disabled)
gameserver.shutdown.restart_schedule =
