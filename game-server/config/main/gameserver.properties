#
# ----------------------------
# 游戏服务器配置 / GS config's:
# ----------------------------

# 服务器国家/地区代码（客户端会与其cc启动参数校验） / Server country code (the client checks it against its cc start parameter)
# 0=KR，1=NA，2=EU，4=JP，5=CN，6=TW，7=RU，99=区域自由（允许任意客户端，但客户端会将角色名限制为10个字符） / 0=KR, 1=NA, 2=EU, 4=JP, 5=CN, 6=TW, 7=RU, 99=Region free (allows any client, but client will limit character names to 10 characters)
# 默认值：99 / Default: 99
gameserver.country.code = 99

# 玩家最高等级 / Max level for players
# 当前：65（4.X） / Actual : 65 (4.X)
gameserver.players.max.level = 65

# 此游戏服务器的时区。请使用 Continent/City 格式而非 GMT±X，以便应用夏令时规则 / Time zone of this GameServer. Make sure to use Continent/City pattern over GMT±X, so daylight saving rules can apply
# 参见：http://joda-time.sourceforge.net/timezones.html / See: http://joda-time.sourceforge.net/timezones.html
# 默认值：空（系统时区） / Default: empty (system time zone)
gameserver.timezone =

# 启用与聊天服务器的连接 / Enable connection with CS (ChatServer)
# 默认值：false / Default: false
gameserver.chatserver.enable = false

# 在聊天服务器频道发言的最低等级 / Min level to write in CS channels
# 默认值：10 / Default: 10
gameserver.chatserver.min_level = 10

# ============================
# 角色创建配置 / Character creation configs:
# ============================
# 角色创建模式（0-2之间的数值） / Character creation mode (Numeric value between 0-2)
# 0：（默认）用户只能在一个阵营内创建角色。 / 0: (Default) User can only create characters inside 1 faction.
# 1：用户可在同一账号创建两个阵营的角色。 / 1: User can create characters of both factions on the same account.
# 2：（角色保留模式）用户绑定到一个阵营，最多创建2个角色且不能进入游戏世界。 / 2: (Character reservation mode) User is bound to 1 faction, can't create more than 2 characters and can't enter the game world.
gameserver.character.creation.mode = 0

# 每个账号最大角色数（0-8之间的数值） / Maximum number of characters per account (Numeric value between 0-8)
# 默认值：5（高级会员为8） / Default: 5 (8 for premium)
gameserver.character.limit.count = 8

# ----------------------------
# 阵营比例配置 / Ratio's configs:
# ----------------------------
# 允许创建角色的阵营（仅输入0-3之间的数值） / Factions that are authorized to create characters (Only enter numeric value between 0-3)
# 0：（默认 - 无限制）两个阵营都可选择 / 0: (Default - No limitations) Both factions can be chosen
# 1：（仅魔族）只能创建魔族角色 / 1: (Asmodians only) You can only create Asmodians characters
# 2：（仅天族）只能创建天族角色 / 2: (Elyos only) You can only create Elyos characters
# 3：（无）不能创建任何新角色 / 3: (Nothing) You can't create any new character
gameserver.character.faction.limitation.mode = 0

# 启用ratios limitation (Server will change the previous config's value when ratios / Enable ratios limitation (Server will change the previous config's value when ratios
# 默认值：false / Default: false
gameserver.ratio.limitation.enable = false

# ----------------------------

# 当某阵营比例达到此值时，不能再创建该阵营新角色 / When a faction ratio reach this value, it's not possible to create new characters of this faction
# 默认值：60 (= 60% of the players are of the same faction) / Default: 60 (= 60% of the players are of the same faction)
gameserver.ratio.min.value = 60

# 参与阵营比例计算的最低角色等级 / Minimum character's level to be taken into account in ratio calculation
# 默认值：10 / Default: 10
gameserver.ratio.min.required.level = 10

# 启用限制时，开始限制新角色创建前每个阵营的最低角色数量 / Minimum characters count in each faction before limitating new characters creation (if enabled)
# 默认值：50 / Default: 50
gameserver.ratio.min.characters_count = 50

# 两个阵营角色总数超过该值后不再使用比例限制 / Maximum character count (sum of both factions) after which ration limitation won't be used anymore
# 默认值：500（如果角色超过500个，就不再需要限制创建） / Default: 500 (If there is more than 500 chars, no need to limit creation anymore ...)
gameserver.ratio.high_player_count.disabling = 500

# ============================
# 杂项配置 / Misc Configs :
# ============================
# 角色重新进入时间（秒） / Characters re-entry time in seconds
# 默认值：20 / Default: 20
gameserver.character.reentry.time = 10

# 两次技能施放之间的最短时间（毫秒）。游戏客户端会据此强制等待。 / Minimum time in milliseconds between two skill casts. The game client will enforce wait times accordingly.
# 默认值：350 / Default: 350
gameserver.min_skill_cast_interval_millis = 350

# 覆盖物品包装限制（pack_count） / Override item wrap limits (pack_count)
# 0 = 使用模板中的默认限制 / 0 = use default limits from templates
# 1-127 = 固定限制（所有不可交易、非灵魂绑定物品可包装） / 1-127 = fixed limit (all non-tradeable, non-soulbound items become wrappable)
# 255 = 所有不可交易、非灵魂绑定物品可无限包装 / 255 = all non-tradeable, non-soulbound items become infinitely wrappable
# 其他正数或负数 = 禁用物品包装 / any other positive or negative number = disable item wrapping
# 默认值：0 / Default: 0
gameserver.item_wrap_limit = 0

# 启用网页奖励支持（玩家会收到插入 web_reward 数据库表的物品） / Enable web reward support (players receive items that are inserted into the web_reward DB table)
# 默认值：false / Default: false
gameserver.web_rewards.enable = false

# 启动时分析任务处理器以识别潜在问题 / Analyze quest handlers on startup to identify potential bugs
gameserver.analysis.quest_handlers = true

# 任务 *.java处理器目录 / Location of quest *.java handlers
gameserver.quest.handler_directory = ./data/handlers/quest
