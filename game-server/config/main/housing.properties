#
# ----------------------------
# 住宅配置 / Housing config's:
# ----------------------------

# 住宅渲染可见范围。值越大，登录时发送的封包越多。 / House render visibility range. The bigger the value, the more packets will be sent during login.
# 默认值：200 / Default: 200
gameserver.housing.visibility.distance = 200

# 住宅拍卖 / Auction for houses
# 默认值：true / Default: true
gameserver.housing.auction.enable = true

# 支付租金 / Pay rent
# 默认值：true / Default: true
gameserver.housing.pay.enable = true

# 拍卖结束日期/时间 / Auction end day/time
# 默认值：0 0 12 ? * SUN （每周日中午12点） / Default: 0 0 12 ? * SUN (each Sunday at 12 midday)
gameserver.housing.auction.end_time = 0 0 12 ? * SUN

# 允许玩家登记住宅拍卖的日期 / Days when registering houses in auction is allowed for players
# 默认值：1, 5 （周一到周五） / Default: 1, 5 (Monday till Friday)
gameserver.housing.auction.register_days = 1, 5

# 住宅维护频率 / House maintenance frequency
# 默认值：0 0 0 ? * MON （每周日午夜） / Default: 0 0 0 ? * MON (each Sunday at midnight)
gameserver.housing.maintain.time = 0 0 0 ? * MON

# 拍卖加价步长限制（出价不能超过当前价格的100%） / Auction bid step limit (bid can not exceed 100% of the current price)
# 默认值：100% / Default: 100%
gameserver.housing.auction.steplimit = 100

# 拍卖默认出价价格 / Auction default bid prices
# 注意：设为0时使用解析数据中的 12000000  / Note: If set to zero 12000000 is used from parsed data
gameserver.housing.auction.default_bid.house = 0
# 注意：设为0时使用解析数据中的 112000000  / Note: If set to zero 112000000 is used from parsed data
gameserver.housing.auction.default_bid.mansion = 0
# 注意：设为0时使用解析数据中的 335000000  / Note: If set to zero 335000000 is used from parsed data
gameserver.housing.auction.default_bid.estate = 0
# 注意：设为0时使用解析数据中的 1000000000  / Note: If set to zero 1000000000 is used from parsed data
gameserver.housing.auction.default_bid.palace = 0

# 参与竞拍所需最低等级 / Auction minimal level required for bidding
# 注意：设为0时使用解析数据中的 21  / Note: If set to zero 21 is used from parsed data
gameserver.housing.auction.bidding.min_level.house = 0
# 注意：设为0时使用解析数据中的 30  / Note: If set to zero 30 is used from parsed data
gameserver.housing.auction.bidding.min_level.mansion = 0
# 注意：设为0时使用解析数据中的 40  / Note: If set to zero 40 is used from parsed data
gameserver.housing.auction.bidding.min_level.estate = 0
# 注意：设为0时使用解析数据中的 50  / Note: If set to zero 50 is used from parsed data
gameserver.housing.auction.bidding.min_level.palace = 0

# 基于拍卖起拍价的登记费 / Registration fee based on the auction starting price
# 默认值：0.3 (30%) / Default: 0.3 (30%)
gameserver.housing.auction.registration_fee = 0.3

# 成交价销售佣金（成功出售后从奖励金额中扣除） / Sales commission of the winning bid (subtracted on successful sale from the reward amount)
# 默认值：0.1 (10%) / Default: 0.1 (10%)
gameserver.housing.auction.sales_commission = 0.1

# 玩家因宽限期失去住宅且未成功出售时，按起拍价退还的百分比 / Refund percentage of the auction starting price if a player loses his house without successfully selling it (due to grace time)
# 默认值：0.5 (50%) / Default: 0.5 (50%)
gameserver.housing.auction.grace_end_refund = 0.5

# 住宅中介补充新的空置住宅的时间；留空则禁用 / Time when housing broker will be filled with new unoccupied houses. Leave empty to disable
# 默认值：0 0 0 ? * MON / Default: 0 0 0 ? * MON
gameserver.housing.auction.auto_fill.time = 0 0 0 ? * MON
# 每种住宅类型最多添加的住宅数 / Maximum number of houses to add per house type
gameserver.housing.auction.auto_fill.limit.HOUSE = 20
gameserver.housing.auction.auto_fill.limit.MANSION = 10
gameserver.housing.auction.auto_fill.limit.ESTATE = 5
gameserver.housing.auction.auto_fill.limit.PALACE = 1